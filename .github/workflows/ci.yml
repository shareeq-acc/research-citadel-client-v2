name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/research-citadel-client

  # Compiled into the browser bundle at build time, not read at runtime — see
  # the Dockerfile. Changing where the app is hosted means rebuilding, not
  # editing an environment file on the server.
  PUBLIC_API_URL: https://citadel.shareeq.xyz/api/v1

jobs:
  check:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm ci` and not `npm install`: it installs exactly the lockfile and
      # fails loudly when the lockfile and package.json disagree, which is the
      # bug this project already had.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  build:
    name: Build and publish
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
          # `main` is what the server follows; the sha is what you roll back to.
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
